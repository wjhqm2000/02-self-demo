name: Issue License

# ── 触发：客户端 POST repository_dispatch 上来 ──────────────────────────────
# client_payload 字段（见 client/trigger_and_fetch.py）：
#   hw_fp       : 客户端采集的硬件指纹（原始，仅用于签名，不落盘到 .lic）
#   key         : sha256(hw_fp)[:16].hex() —— 作为 .lic 文件名
#   customer_id : 订单号 / 用户名（签名前哈希脱敏）
#   tier        : "pro" / "basic" / "trial"
#   auth        : HMAC-SHA256(secret, "hw_fp|key|customer_id|tier") 轻量防刷
#
# run-name 携带 key：客户端轮询 run 列表时按 display_title 精确匹配，
# 避免时间窗口串号。
run-name: issue-license ${{ github.event.client_payload.key }}

on:
  repository_dispatch:
    types: [issue-license]

# ── 权限：仅需要 contents: write 来 push 到 license-result 分支 ────────────
# 这里用的是 GITHUB_TOKEN（Action 内置临时 token），不是用户的 PAT。
permissions:
  contents: write

# ── 并发控制：同一个 key 的签名请求排队，不同 key 并行 ──────────────────────
concurrency:
  group: license-issue-${{ github.event.client_payload.key }}
  cancel-in-progress: false

jobs:
  sign-and-push:
    runs-on: ubuntu-latest

    # ── 安全修复 #1：所有 client_payload 字段统一在 env 声明 ────────────────
    # run: 脚本里只允许出现 "$CP_*" 双引号环境变量，禁止直接插值
    # ${{ github.event.client_payload.* }}，防止命令注入 / 私钥泄露。
    env:
      CP_HW_FP: ${{ github.event.client_payload.hw_fp }}
      CP_KEY: ${{ github.event.client_payload.key }}
      CP_CUSTOMER: ${{ github.event.client_payload.customer_id }}
      CP_TIER: ${{ github.event.client_payload.tier }}

    steps:
      # ── Step 1: 拉代码（issuer/sign_license.py 需要 import client/verify_license.py）
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir cryptography

      # ── Step 2: 签名 ──────────────────────────────────────────────────────
      # RSA_PRIVATE_KEY / DEMO_HMAC_SECRET 从仓库 Secrets 注入。
      # 产物写到 $RUNNER_TEMP（LICENSE_OUT_DIR），不污染 git 工作区，
      # 避免 checkout -f 时被本地同名文件阻塞。
      - name: Sign license
        env:
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          DEMO_HMAC_SECRET: ${{ secrets.DEMO_HMAC_SECRET }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          LICENSE_OUT_DIR: ${{ runner.temp }}
        run: |
          set -e
          echo "--- GHA license issuance ---"
          echo "key (file)  : $CP_KEY"
          echo "tier        : $CP_TIER"
          echo "customer_id : (will be hashed before signing)"
          echo "hw_fp       : (will be hashed before signing)"
          echo "----------------------------"

          python issuer/sign_license.py

          ls -l "$RUNNER_TEMP"/*.lic

      # ── Step 3: Git push 到 license-result 分支 ──────────────────────────
      # 安全修复 #2：checkout -f 强制切换；产物从 $RUNNER_TEMP 拷入。
      # Retry 循环：fetch + rebase 吸收并发 push，3 次重试，间隔 5 秒。
      - name: Commit and push to license-result branch
        run: |
          set -e

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="license-result"
          FILE="${CP_KEY}.lic"
          SRC="${RUNNER_TEMP}/${FILE}"

          if [ ! -f "$SRC" ]; then
            echo "FATAL: signed file $SRC not found (sign step failed?)"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} exists — force checkout..."
            git fetch origin "${BRANCH}"
            git checkout -f "${BRANCH}"
            git pull --rebase origin "${BRANCH}"
          else
            echo "Branch ${BRANCH} missing — creating orphan branch (lic files only)..."
            git checkout --orphan "${BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          for attempt in 1 2 3; do
            echo "--- Push attempt ${attempt}/3 for ${FILE} ---"

            cp "${SRC}" "${FILE}"
            git add "${FILE}"

            # --allow-empty: same content re-activation still produces a fresh
            # nonce/signature, but keep the loop alive even if identical.
            git commit -m "license: issue for ${CP_KEY} @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                       --allow-empty || true

            if git push origin "${BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi

            echo "Push failed on attempt ${attempt} (concurrent push?). fetch + rebase, sleep 5s..."
            git fetch origin "${BRANCH}"
            if ! git rebase "origin/${BRANCH}"; then
              git rebase --abort || true
              git reset --hard "origin/${BRANCH}"
            fi
            sleep 5
          done

          echo "All 3 push attempts failed. Aborting."
          exit 1

      # ── Step 4: Print download URL ────────────────────────────────────────
      # 安全修复 #6：使用 github.repository（owner/repo 一体），
      # github.repository.owner.name 是无效上下文。
      - name: Print download URL
        run: |
          echo "License file will be available at:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/license-result/${CP_KEY}.lic"
          echo "(add ?t=<epoch> to bust CDN cache when polling)"

      - name: Summary
        if: always()
        run: |
          echo "Workflow finished for key=${CP_KEY}"
